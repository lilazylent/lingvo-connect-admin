[project]
name = "lingvo-connect-admin-api"
version = "0.1.0"
description = "Local-first administrative API for Lingvo Connect"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.2",
  "email-validator==2.2.0",
  "fastapi==0.115.12",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.8.1",
  "python-multipart==0.0.20",
  "pyotp==2.9.0",
  "qrcode[pil]==8.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.34.0",
  "openpyxl==3.1.5",
  "pypdf==5.4.0",
  "python-docx==1.1.2",
  "xlrd==2.0.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "xlwt==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
